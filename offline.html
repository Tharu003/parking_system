<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FF6B00">
<title>ParkSmart | Offline</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
       background:#0A192F;color:#e2e8f0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
  .card{max-width:420px;width:100%;background:#112240;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:36px 28px}
  .logo{width:72px;height:72px;margin:0 auto 18px;border-radius:18px;background:#FF6B00;color:#fff;
        font-size:42px;font-weight:800;display:flex;align-items:center;justify-content:center}
  h1{font-size:22px;margin:0 0 8px}
  p{margin:0 0 10px;color:#94a3b8;line-height:1.55;font-size:15px}
  button{margin-top:14px;background:#FF6B00;color:#fff;border:0;border-radius:12px;padding:13px 26px;
         font-size:15px;font-weight:700;cursor:pointer}
  button:active{transform:scale(.98)}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">P</div>
    <h1>Connection නැහැ</h1>
    <p>ParkSmart ට server එකත් එක්ක connect වෙන්න බැහැ. Parking data live database එකෙන් එන නිසා internet / network connection එක ඕන.</p>
    <p>Wi-Fi හෝ mobile data check කරලා ආයෙත් try කරන්න.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
